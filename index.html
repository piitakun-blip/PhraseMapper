<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Phrase Mapper">
    <title>EN ➜ DE: Ward's Phrasen-Mapper</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            
            --primary-blue: #0284c7;
            --blue-light: #f0f9ff;
            
            --primary-orange: #c2410c;
            --orange-light: #fff7ed;
            
            --primary-sakura: #db2777;
            --sakura-light: #fdf2f8;
            
            --primary-sangria: #dc2626;
            --sangria-light: #fef2f2;
            
            --primary-lavender: #6366f1;
            --lavender-light: #e0e7ff;
            
            --primary-emerald: #059669;
            --emerald-light: #ecfdf5;
            
            --primary-crimson: #be123c;
            --crimson-light: #fff1f2;
            
            --primary-gold: #ea580c;
            --gold-light: #fff7ed;

            /* Dynamic Theme Variables managed by JS */
            --theme-color: var(--primary-blue);
            --theme-light: var(--blue-light);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 2rem 1rem;
            margin: 0;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 1.85rem;
            color: #0f172a;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            text-align: center;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background-color: #f1f5f9;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .lang-selector {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .lang-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .lang-btn.active {
            background-color: var(--theme-color);
            color: white;
            border-color: var(--theme-color);
        }

        .lang-btn:hover:not(.active) {
            background-color: #e2e8f0;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--theme-color);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .input-card {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-card label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .text-area-wrapper {
            position: relative;
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 0.75rem;
            padding-right: 2.5rem;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: none;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-color);
        }

        textarea:focus {
            outline: none;
            border-color: var(--theme-color);
            box-shadow: 0 0 0 3px var(--theme-light);
        }

        .audio-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0;
        }

        .audio-btn:hover {
            background: var(--theme-light);
            border-color: var(--theme-color);
        }

        .map-section {
            margin-top: 1.5rem;
        }

        .map-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }

        .phrase-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem;
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            min-height: 60px;
            align-items: center;
            color: #64748b;
        }

        .phrase-badge {
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .phrase-badge.active {
            background: var(--theme-color);
            color: white;
            border-color: var(--theme-color);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            body {
                padding: 0.65rem 0.45rem;
            }

            .container {
                padding: 1rem 0.75rem;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.22rem;
                line-height: 1.25;
                padding-bottom: 0.6rem;
                gap: 0.4rem;
            }

            .control-panel {
                padding: 0.7rem;
                gap: 0.75rem;
                margin-bottom: 1.2rem;
                align-items: stretch;
            }

            .lang-selector {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
                gap: 0.45rem;
            }

            .lang-selector > span {
                grid-column: 1 / -1;
            }

            .lang-btn {
                justify-content: center;
                padding: 0.45rem 0.55rem;
                min-width: 0;
            }

            .toggle-container {
                width: 100%;
                justify-content: space-between;
            }

            .grid-inputs {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">EN ➜ DE: Ward's Phrasen-Mapper</h1>

    <!-- Control Panel Elements -->
    <div class="control-panel">
        <div class="lang-selector">
            <span>Target Language:</span>
            <button class="lang-btn active" data-lang="de" data-theme="blue" data-label="German">🇩🇪 DE</button>
            <button class="lang-btn" data-lang="ja" data-theme="sakura" data-label="Japanese">🇯🇵 JA</button>
            <button class="lang-btn" data-lang="es" data-theme="orange" data-label="Spanish">🇪🇸 ES</button>
            <button class="lang-btn" data-lang="fr" data-theme="lavender" data-label="French">🇫🇷 FR</button>
            <button class="lang-btn" data-lang="it" data-theme="emerald" data-label="Italian">🇮🇹 IT</button>
