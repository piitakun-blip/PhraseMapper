<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>EN ➜ Target Phrase Mapper</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --primary-blue: #0284c7;
            --blue-light: #f0f9ff;
            --primary-orange: #c2410c;
            --orange-light: #fff7ed;
            --primary-sakura: #db2777;
            --sakura-light: #fdf2f8;
            --primary-sangria: #dc2626;
            --sangria-light: #fef2f2;
            --primary-lavender: #6366f1;
            --lavender-light: #e0e7ff;
            --primary-emerald: #059669;
            --emerald-light: #ecfdf5;
            --primary-crimson: #be123c;
            --crimson-light: #fff1f2;
            --primary-gold: #ea580c;
            --gold-light: #fff7ed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 2rem 1rem;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #0f172a;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.75rem;
            text-align: center;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background-color: #f1f5f9;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .lang-selector {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            font-weight: 600;
        }

        .lang-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.6rem;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            white-space: nowrap;
        }

        .flag-icon {
            width: 18px;
            height: 13px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 1px rgba(0,0,0,0.3);
        }

        .lang-btn.active.orange-mode { background-color: var(--primary-orange); color: white; }
        .lang-btn.active.sakura-mode { background-color: var(--primary-sakura); color: white; }
        .lang-btn.active.sangria-mode { background-color: var(--primary-sangria); color: white; }
        .lang-btn.active.lavender-mode { background-color: var(--primary-lavender); color: white; }
        .lang-btn.active.emerald-mode { background-color: var(--primary-emerald); color: white; }
        .lang-btn.active.crimson-mode { background-color: var(--primary-crimson); color: white; }
        .lang-btn.active.gold-mode { background-color: var(--primary-gold); color: white; }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            body { padding: 0.4rem; }
            .container { padding: 0.75rem; }
            .grid-inputs { grid-template-columns: 1fr; }
            textarea { font-size: 16px; }
            .lang-selector { gap: 0.25rem; }
            .lang-btn { padding: 0.3rem 0.5rem; font-size: 0.8rem; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .input-wrapper { position: relative; width: 100%; }

        textarea {
            width: 100%;
            padding: 0.75rem;
            padding-right: 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        .play-btn {
            position: absolute; right: 0.5rem; top: 0.5rem;
            background: none; border: none; cursor: pointer; font-size: 1.2rem;
        }

        .retranslation-box {
            margin-top: 0.4rem;
            padding: 0.6rem;
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            font-size: 0.88rem;
            color: #334155;
        }

        .retranslation-title {
            font-weight: bold;
            font-size: 0.72rem;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 0.2rem;
        }

        .output-section { display: flex; flex-direction: column; gap: 1.5rem; }
        .row-container { border: 1px solid var(--border-color); border-radius: 8px; padding: 1.25rem; background-color: #fafafa; }
        .row-title { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 0.75rem; color: #64748b; }
        .word-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .word-card {
            position: relative; display: flex; flex-direction: column; align-items: center;
            padding: 0.8rem 1.2rem 0.6rem; border-radius: 8px; border: 1.5px solid; min-width: 100px; text-align: center;
        }
        .word-card.english-card { background-color: var(--blue-light); border-color: var(--primary-blue); color: #0369a1; }
        .word-card.foreign-card.orange-mode { background-color: var(--orange-light); border-color: var(--primary-orange); }
        .word-card.foreign-card.sakura-mode { background-color: var(--sakura-light); border-color: var(--primary-sakura); }
        .word-card.foreign-card.sangria-mode { background-color: var(--sangria-light); border-color: var(--primary-sangria); }
        .word-card.foreign-card.lavender-mode { background-color: var(--lavender-light); border-color: var(--primary-lavender); }
        .word-card.foreign-card.emerald-mode { background-color: var(--emerald-light); border-color: var(--primary-emerald); }
        .word-card.foreign-card.crimson-mode { background-color: var(--crimson-light); border-color: var(--primary-crimson); }
        .word-card.foreign-card.gold-mode { background-color: var(--gold-light); border-color: var(--primary-gold); }

        .phrase-text { font-size: 1.05rem; font-weight: 600; }
        .phrase-translation { font-size: 0.8rem; font-style: italic; opacity: 0.85; margin-top: 0.2rem; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="mainTitle">EN ➜ DE: Ward's Phrasen-Mapper</h1>
    
    <div class="control-panel">
        <div class="lang-selector">
            <span>Target:</span>
            <button class="lang-btn active orange-mode" id="btnDE" onclick="setLanguage('de')">
                <img src="https://flagcdn.com/de.svg" class="flag-icon" alt="DE"> DE
            </button>
            <button class="lang-btn" id="btnJA" onclick="setLanguage('ja')">
                <img src="https://flagcdn.com/jp.svg" class="flag-icon" alt="JA"> JA
            </button>
            <button class="lang-btn" id="btnES" onclick="setLanguage('es')">
                <img src="https://flagcdn.com/es.svg" class="flag-icon" alt="ES"> ES
            </button>
            <button class="lang-btn" id="btnFR" onclick="setLanguage('fr')">
                <img src="https://flagcdn.com/fr.svg" class="flag-icon" alt="FR"> FR
            </button>
            <button class="lang-btn" id="btnIT" onclick="setLanguage('it')">
                <img src="https://flagcdn.com/it.svg" class="flag-icon" alt="IT"> IT
            </button>
            <button class="lang-btn" id="btnRU" onclick="setLanguage('ru')">
                <img src="https://flagcdn.com/ru.svg" class="flag-icon" alt="RU"> RU
            </button>
            <button class="lang-btn" id="btnZH" onclick="setLanguage('zh')">
                <img src="https://flagcdn.com/cn.svg" class="flag-icon" alt="ZH"> ZH
            </button>
        </div>
        <div>
            <label><input type="checkbox" id="autoTranslateToggle" checked> Auto-Translate</label>
            <label style="margin-left: 0.5rem; font-size: 0.8rem; font-weight: normal;">
                <input type="checkbox" id="allowBackupToggle" checked> Use backup if Google fails
            </label>
        </div>
    </div>

    <div class="grid-inputs">
        <div class="input-group">
            <label style="color:var(--primary-blue)">English Sentence</label>
            <div class="input-wrapper">
                <textarea id="englishInput" rows="2" placeholder="Type English sentence..." oninput="handleInput('en')"></textarea>
                <button class="play-btn" onclick="speakText('englishInput', 'en')">🔊</button>
            </div>
        </div>

        <div class="input-group">
            <label id="foreignLabel">German Sentence</label>
            <div class="input-wrapper">
                <textarea id="foreignInput" rows="2" placeholder="Translation..." oninput="handleInput('foreign')"></textarea>
                <button class="play-btn" onclick="speakText('foreignInput', currentLang)">🔊</button>
            </div>
            <div class="retranslation-box">
                <div class="retranslation-title">Re-translation (English)</div>
                <div id="retranslationText"><em>Re-translation will appear here...</em></div>
            </div>
        </div>
    </div>

    <div class="output-section">
        <div class="row-container">
            <div class="row-title">English Phrase Map</div>
            <div id="englishOutput" class="word-grid"></div>
        </div>

        <div class="row-container">
            <div class="row-title" id="foreignRowTitle">German Phrase Map</div>
            <div id="foreignOutput" class="word-grid"></div>
        </div>
    </div>
</div>

<script>
    let currentLang = 'de';
    let translationTimeout;
    const TRANSLATION_CACHE = "wardPhraseMapper:v12:";

    const LANG_CONFIG = {
        de: { name: 'German', theme: 'orange-mode' },
        ja: { name: 'Japanese', theme: 'sakura-mode' },
        es: { name: 'Spanish', theme: 'sangria-mode' },
        fr: { name: 'French', theme: 'lavender-mode' },
        it: { name: 'Italian', theme: 'emerald-mode' },
        ru: { name: 'Russian', theme: 'crimson-mode' },
        zh: { name: 'Chinese', theme: 'gold-mode' }
    };

    function speakText(inputId, langCode) {
        const text = document.getElementById(inputId).value;
        if (!text || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        window.speechSynthesis.speak(utterance);
    }

    async function translateUnified(text, sourceLang, targetLang) {
        if (!text.trim()) return { translation: "" };

        const cacheKey = TRANSLATION_CACHE + `${sourceLang}>${targetLang}:${text}`;
        const cached = localStorage.getItem(cacheKey);
        if (cached) return JSON.parse(cached);

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=` + encodeURIComponent(text);
            const resp = await fetch(url);
            if (!resp.ok) throw new Error("Google throttled");
            const data = await resp.json();
            let trans = "";
            if (data && data[0]) {
                data[0].forEach(seg => { if (seg[0]) trans += seg[0]; });
            }
            if (trans.trim()) {
                const result = { translation: trans.trim() };
                localStorage.setItem(cacheKey, JSON.stringify(result));
                return result;
            }
        } catch(e) {
            console.warn("Primary API failed. Trying backup...");
        }

        if (document.getElementById("allowBackupToggle").checked) {
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`;
                const resp = await fetch(url);
                if (resp.ok) {
                    const data = await resp.json();
                    if (data?.responseData?.translatedText) {
                        return { translation: data.responseData.translatedText.trim() };
                    }
                }
            } catch(e) {
                console.error("Backup engine failed:", e);
            }
        }
        return null;
    }

    async function translatePhraseBatch(phrases, sourceLang, targetLang) {
        if (!phrases.length) return [];
        const combined = phrases.join("\n");
        const res = await translateUnified(combined, sourceLang, targetLang);
        if (res && res.translation) {
            return res.translation.split("\n");
        }
        return new Array(phrases.length).fill("");
    }

    function handleInput(lang) {
        clearTimeout(translationTimeout);
        translationTimeout = setTimeout(async () => {
            const auto = document.getElementById("autoTranslateToggle").checked;
            const engInput = document.getElementById("englishInput");
            const foreignInput = document.getElementById("foreignInput");

            if (lang === 'en' && auto && engInput.value.trim()) {
                const res = await translateUnified(engInput.value.trim(), 'en', currentLang);
                if (res) foreignInput.value = res.translation;
            } else if (lang === 'foreign' && auto && foreignInput.value.trim()) {
                const res = await translateUnified(foreignInput.value.trim(), currentLang, 'en');
                if (res) engInput.value = res.translation;
            }

            if (foreignInput.value.trim()) {
                const retrans = await translateUnified(foreignInput.value.trim(), currentLang, 'en');
                document.getElementById("retranslationText").innerText = retrans ? retrans.translation : "Re-translation failed";
            } else {
                document.getElementById("retranslationText").innerHTML = "<em>Re-translation will appear here...</em>";
            }

            updatePhraseMaps();
        }, 500);
    }

    function splitPhrases(text) {
        if (!text) return [];
        return text.trim().split(/\s+/).filter(Boolean);
    }

    async function updatePhraseMaps() {
        const engText = document.getElementById("englishInput").value;
        const foreignText = document.getElementById("foreignInput").value;
        const config = LANG_CONFIG[currentLang];

        const engPhrases = splitPhrases(engText);
        const foreignPhrases = splitPhrases(foreignText);

        const engGrid = document.getElementById("englishOutput");
        const foreignGrid = document.getElementById("foreignOutput");

        engGrid.innerHTML = engPhrases.map((p, i) => `
            <div class="word-card english-card">
                <div class="phrase-text">${p}</div>
                <div class="phrase-translation" id="eng-p-${i}">...</div>
            </div>
        `).join("");

        foreignGrid.innerHTML = foreignPhrases.map((p, i) => `
            <div class="word-card foreign-card ${config.theme}">
                <div class="phrase-text">${p}</div>
                <div class="phrase-translation" id="for-p-${i}">...</div>
            </div>
        `).join("");

        if (engPhrases.length) {
            const translatedEng = await translatePhraseBatch(engPhrases, 'en', currentLang);
            translatedEng.forEach((t, i) => {
                const el = document.getElementById(`eng-p-${i}`);
                if (el) el.innerText = t || "";
            });
        }

        if (foreignPhrases.length) {
            const translatedForeign = await translatePhraseBatch(foreignPhrases, currentLang, 'en');
            translatedForeign.forEach((t, i) => {
                const el = document.getElementById(`for-p-${i}`);
                if (el) el.innerText = t || "";
            });
        }
    }

    function setLanguage(lang) {
        currentLang = lang;
        const config = LANG_CONFIG[lang];

        // Update UI Labels
        document.getElementById('mainTitle').innerText = `EN ➜ ${lang.toUpperCase()}: Ward's Phrasen-Mapper`;
        document.getElementById('foreignLabel').innerText = `${config.name} Sentence`;
        document.getElementById('foreignRowTitle').innerText = `${config.name} Phrase Map`;

        // Update Active States on Buttons
        Object.keys(LANG_CONFIG).forEach(code => {
            const btn = document.getElementById('btn' + code.toUpperCase());
            if (btn) {
                btn.className = "lang-btn";
                if (code === lang) {
                    btn.classList.add("active", config.theme);
                }
            }
        });

        handleInput('en');
    }

    // Initialize state on load
    setLanguage('de');
</script>
</body>
</html>
