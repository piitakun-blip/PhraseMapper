<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>EN ➜ Target Phrase Mapper</title>

    <!-- Japanese reading / Romaji -->
    <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;

            --primary-blue: #0284c7;
            --blue-light: #f0f9ff;

            --primary-orange: #c2410c;
            --orange-light: #fff7ed;

            --primary-sakura: #db2777;
            --sakura-light: #fdf2f8;

            --primary-sangria: #dc2626;
            --sangria-light: #fef2f2;

            --primary-lavender: #6366f1;
            --lavender-light: #e0e7ff;

            --primary-emerald: #059669;
            --emerald-light: #ecfdf5;

            --primary-crimson: #be123c;
            --crimson-light: #fff1f2;

            --primary-gold: #ea580c;
            --gold-light: #fff7ed;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--text-color);

            line-height: 1.5;

            padding: 2rem 1rem;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;

            background: var(--card-bg);

            padding: 2rem;

            border-radius: 12px;

            box-shadow:
                0 4px 6px -1px rgb(0 0 0 / 0.1);

            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;

            font-size: 1.6rem;

            color: #0f172a;

            border-bottom:
                2px solid var(--border-color);

            padding-bottom: 0.75rem;

            text-align: center;
        }

        .control-panel {
            display: flex;

            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;

            gap: 1rem;

            margin-bottom: 2rem;

            background-color: #f1f5f9;

            padding: 0.75rem 1.25rem;

            border-radius: 8px;

            border: 1px solid var(--border-color);
        }

        .lang-selector {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 0.35rem;

            font-weight: 600;
        }

        .lang-btn {
            background-color: #ffffff;

            border: 1px solid var(--border-color);

            padding: 0.35rem 0.6rem;

            border-radius: 16px;

            cursor: pointer;

            font-weight: 700;

            font-size: 0.85rem;

            display: inline-flex;

            align-items: center;

            gap: 0.35rem;

            white-space: nowrap;
        }

        .lang-btn:hover {
            filter: brightness(0.97);
        }

        .flag-icon {
            width: 18px;
            height: 13px;

            object-fit: cover;

            border-radius: 2px;

            box-shadow:
                0 0 1px rgba(0,0,0,0.3);
        }

        .lang-btn.active.orange-mode {
            background-color: var(--primary-orange);
            color: white;
        }

        .lang-btn.active.sakura-mode {
            background-color: var(--primary-sakura);
            color: white;
        }

        .lang-btn.active.sangria-mode {
            background-color: var(--primary-sangria);
            color: white;
        }

        .lang-btn.active.lavender-mode {
            background-color: var(--primary-lavender);
            color: white;
        }

        .lang-btn.active.emerald-mode {
            background-color: var(--primary-emerald);
            color: white;
        }

        .lang-btn.active.crimson-mode {
            background-color: var(--primary-crimson);
            color: white;
        }

        .lang-btn.active.gold-mode {
            background-color: var(--primary-gold);
            color: white;
        }

        .options {
            display: flex;

            flex-direction: column;

            gap: 0.25rem;
        }

        .options label {
            margin: 0 !important;

            font-size: 0.82rem;

            font-weight: 600;

            text-transform: none;
        }

        .grid-inputs {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 1.5rem;

            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 0.4rem;
            }

            .container {
                padding: 0.75rem;
            }

            .grid-inputs {
                grid-template-columns: 1fr;
            }

            textarea {
                font-size: 16px;
            }

            .lang-selector {
                gap: 0.25rem;
            }

            .lang-btn {
                padding: 0.3rem 0.5rem;

                font-size: 0.8rem;
            }

            .control-panel {
                align-items: flex-start;
            }
        }

        .input-group {
            display: flex;

            flex-direction: column;

            gap: 0.5rem;
        }

        label {
            font-weight: 600;

            font-size: 0.9rem;

            text-transform: uppercase;

            display: flex;

            justify-content: space-between;
        }

        .input-wrapper {
            position: relative;

            width: 100%;
        }

        textarea {
            width: 100%;

            padding: 0.75rem;

            padding-right: 2.5rem;

            border:
                1px solid var(--border-color);

            border-radius: 6px;

            font-size: 1rem;

            font-family: inherit;

            resize: vertical;
        }

        textarea:focus {
            outline: none;

            border-color:
                var(--primary-blue);

            box-shadow:
                0 0 0 2px
                rgba(2,132,199,0.1);
        }

        .play-btn {
            position: absolute;

            right: 0.5rem;
            top: 0.5rem;

            background: none;

            border: none;

            cursor: pointer;

            font-size: 1.2rem;
        }

        .retranslation-box {
            margin-top: 0.4rem;

            padding: 0.6rem;

            background: #f8fafc;

            border:
                1px dashed var(--border-color);

            border-radius: 6px;

            font-size: 0.88rem;

            color: #334155;
        }

        .retranslation-title {
            font-weight: bold;

            font-size: 0.72rem;

            text-transform: uppercase;

            color: #64748b;

            margin-bottom: 0.2rem;
        }

        .output-section {
            display: flex;

            flex-direction: column;

            gap: 1.5rem;
        }

        .row-container {
            border:
                1px solid var(--border-color);

            border-radius: 8px;

            padding: 1.25rem;

            background-color: #fafafa;
        }

        .row-title {
            font-size: 0.8rem;

            font-weight: bold;

            text-transform: uppercase;

            margin-bottom: 0.75rem;

            color: #64748b;
        }

        .word-grid {
            display: flex;

            flex-wrap: wrap;

            gap: 0.75rem;
        }

        .word-card {
            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding:
                0.8rem
                1.2rem
                0.6rem;

            border-radius: 8px;

            border: 1.5px solid;

            min-width: 110px;

            max-width: 100%;

            text-align: center;
        }

        .word-card.english-card {
            background-color:
                var(--blue-light);

            border-color:
                var(--primary-blue);

            color: #0369a1;
        }

        .word-card.foreign-card.orange-mode {
            background-color:
                var(--orange-light);

            border-color:
                var(--primary-orange);
        }

        .word-card.foreign-card.sakura-mode {
            background-color:
                var(--sakura-light);

            border-color:
                var(--primary-sakura);
        }

        .word-card.foreign-card.sangria-mode {
            background-color:
                var(--sangria-light);

            border-color:
                var(--primary-sangria);
        }

        .word-card.foreign-card.lavender-mode {
            background-color:
                var(--lavender-light);

            border-color:
                var(--primary-lavender);
        }

        .word-card.foreign-card.emerald-mode {
            background-color:
                var(--emerald-light);

            border-color:
                var(--primary-emerald);
        }

        .word-card.foreign-card.crimson-mode {
            background-color:
                var(--crimson-light);

            border-color:
                var(--primary-crimson);
        }

        .word-card.foreign-card.gold-mode {
            background-color:
                var(--gold-light);

            border-color:
                var(--primary-gold);
        }

        .phrase-text {
            font-size: 1.05rem;

            font-weight: 600;

            overflow-wrap: anywhere;
        }

        .phrase-reading {
            font-size: 0.8rem;

            font-weight: 600;

            color: #be185d;

            margin-top: 0.15rem;
        }

        .phrase-romaji {
            font-size: 0.75rem;

            font-style: italic;

            color: #475569;
        }

        .phrase-translation {
            font-size: 0.82rem;

            font-style: italic;

            opacity: 0.9;

            margin-top: 0.25rem;

            overflow-wrap: anywhere;
        }

        .empty-message {
            color: #94a3b8;

            font-style: italic;

            font-size: 0.9rem;
        }

        .status {
            margin-top: 1rem;

            font-size: 0.75rem;

            color: #64748b;

            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 id="mainTitle">
        EN ➜ DE: Ward's Phrasen-Mapper
    </h1>


    <!-- =========================================================
         LANGUAGE CONTROLS
         ========================================================= -->

    <div class="control-panel">

        <div class="lang-selector">

            <span>Target:</span>

            <button
                class="lang-btn active orange-mode"
                id="btnDE"
                onclick="setLanguage('de')"
            >
                <img
                    src="https://flagcdn.com/de.svg"
                    class="flag-icon"
                    alt="DE"
                >
                DE
            </button>

            <button
                class="lang-btn"
                id="btnJA"
                onclick="setLanguage('ja')"
            >
                <img
                    src="https://flagcdn.com/jp.svg"
                    class="flag-icon"
                    alt="JA"
                >
                JA
            </button>

            <button
                class="lang-btn"
                id="btnES"
                onclick="setLanguage('es')"
            >
                <img
                    src="https://flagcdn.com/es.svg"
                    class="flag-icon"
                    alt="ES"
                >
                ES
            </button>

            <button
                class="lang-btn"
                id="btnFR"
                onclick="setLanguage('fr')"
            >
                <img
                    src="https://flagcdn.com/fr.svg"
                    class="flag-icon"
                    alt="FR"
                >
                FR
            </button>

            <button
                class="lang-btn"
                id="btnIT"
                onclick="setLanguage('it')"
            >
                <img
                    src="https://flagcdn.com/it.svg"
                    class="flag-icon"
                    alt="IT"
                >
                IT
            </button>

            <button
                class="lang-btn"
                id="btnRU"
                onclick="setLanguage('ru')"
            >
                <img
                    src="https://flagcdn.com/ru.svg"
                    class="flag-icon"
                    alt="RU"
                >
                RU
            </button>

            <button
                class="lang-btn"
                id="btnZH"
                onclick="setLanguage('zh')"
            >
                <img
                    src="https://flagcdn.com/cn.svg"
                    class="flag-icon"
                    alt="ZH"
                >
                ZH
            </button>

        </div>


        <div class="options">

            <label>
                <span>
                    <input
                        type="checkbox"
                        id="autoTranslateToggle"
                        checked
                    >
                    Auto-Translate
                </span>
            </label>

            <label>
                <span>
                    <input
                        type="checkbox"
                        id="allowBackupToggle"
                        checked
                    >
                    Use backup if Google fails (results may be less reliable)
                </span>
            </label>

        </div>

    </div>


    <!-- =========================================================
         INPUTS
         ========================================================= -->

    <div class="grid-inputs">


        <!-- ENGLISH -->

        <div class="input-group">

            <label
                style="color:var(--primary-blue)"
            >
                English Sentence
            </label>

            <div class="input-wrapper">

                <textarea
                    id="englishInput"
                    rows="3"
                    placeholder="Type English sentence..."
                    oninput="handleInput('en')"
                ></textarea>

                <button
                    class="play-btn"
                    onclick="speakText('englishInput', 'en-US')"
                    title="Listen"
                >
                    🔊
                </button>

            </div>

        </div>


        <!-- TARGET -->

        <div class="input-group">

            <label
                id="foreignLabel"
            >
                German Sentence
            </label>

            <div class="input-wrapper">

                <textarea
                    id="foreignInput"
                    rows="3"
                    placeholder="Translation..."
                    oninput="handleInput('foreign')"
                ></textarea>

                <button
                    class="play-btn"
                    onclick="speakText('foreignInput', currentLang)"
                    title="Listen"
                >
                    🔊
                </button>

            </div>


            <div class="retranslation-box">

                <div class="retranslation-title">
                    Re-translation (English)
                </div>

                <div id="retranslationText">
                    <em>
                        Re-translation will appear here...
                    </em>
                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         OUTPUT
         ========================================================= -->

    <div class="output-section">


        <div class="row-container">

            <div class="row-title">
                English Phrase Map
            </div>

            <div
                id="englishOutput"
                class="word-grid"
            >
                <div class="empty-message">
                    Enter an English sentence above.
                </div>
            </div>

        </div>


        <div class="row-container">

            <div
                class="row-title"
                id="foreignRowTitle"
            >
                German Phrase Map
            </div>

            <div
                id="foreignOutput"
                class="word-grid"
            >
                <div class="empty-message">
                    Translation will appear here.
                </div>
            </div>

        </div>

    </div>


    <div
        class="status"
        id="statusText"
    ></div>

</div>


<script>

/* ================================================================
   GLOBAL STATE
   ================================================================ */

let currentLang = "de";

let translationTimeout = null;

let fullTranslationController = null;

let updateGeneration = 0;

function isMobileMode() {
    return window.matchMedia("(max-width: 768px)").matches;
}

const TRANSLATION_CACHE =
    "wardPhraseMapper:v26:";


/* ================================================================
   LANGUAGE CONFIG
   ================================================================ */

const LANG_CONFIG = {

    de: {
        name: "German",
        theme: "orange-mode"
    },

    ja: {
        name: "Japanese",
        theme: "sakura-mode"
    },

    es: {
        name: "Spanish",
        theme: "sangria-mode"
    },

    fr: {
        name: "French",
        theme: "lavender-mode"
    },

    it: {
        name: "Italian",
        theme: "emerald-mode"
    },

    ru: {
        name: "Russian",
        theme: "crimson-mode"
    },

    zh: {
        name: "Chinese",
        theme: "gold-mode"
    }

};


/* ================================================================
   HTML ESCAPE
   ================================================================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ================================================================
   SPEECH
   ================================================================ */

function speakText(inputId, langCode) {

    const element =
        document.getElementById(inputId);

    if (!element) return;

    const text =
        element.value.trim();

    if (
        !text ||
        !window.speechSynthesis
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = langCode;

    window.speechSynthesis.speak(
        utterance
    );

}




function setTranslationProviderStatus(provider, detail = "") {

    const status =
        document.getElementById(
            "statusText"
        );

    if (!status) return;


    if (provider === "google") {

        status.innerText =
            detail ||
            "Google Translate available";

    }

    else if (provider === "backup") {

        status.innerText =
            detail ||
            "Backup translator used — results may be less reliable";

    }

    else if (provider === "unavailable") {

        status.innerText =
            detail ||
            "Translation service unavailable";

    }

    else {

        status.innerText =
            detail || "";

    }

}


function backupAllowed() {

    const toggle =
        document.getElementById(
            "allowBackupToggle"
        );

    return !!(
        toggle &&
        toggle.checked
    );

}


/* ================================================================
   TRANSLATION
   ================================================================ */

async function translateUnified(
    text,
    sourceLang,
    targetLang,
    options = {}
) {

    if (!text || !text.trim()) {

        return {
            translation: "",
            translit: "",
            provider: "none"
        };

    }

    const allowBackup =
        options.allowBackup === true;

    const signal =
        options.signal || null;


    const cacheKey =
        TRANSLATION_CACHE +
        `${sourceLang}>${targetLang}:${text}`;


    try {

        const cached =
            localStorage.getItem(
                cacheKey
            );

        if (cached) {

            const parsed =
                JSON.parse(cached);

            return {
                ...parsed,
                provider: "google"
            };

        }

    } catch (error) {

        console.warn(
            "Cache read failed:",
            error
        );

    }


    try {

        const url =
            "https://translate.googleapis.com/translate_a/single" +
            "?client=gtx" +
            "&sl=" +
            encodeURIComponent(sourceLang) +
            "&tl=" +
            encodeURIComponent(targetLang) +
            "&dt=t" +
            "&dt=rm" +
            "&q=" +
            encodeURIComponent(text);


        const response =
            await fetch(
                url,
                {
                    signal,
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Google translation failed"
            );

        }


        const data =
            await response.json();


        let translation = "";
        let translit = "";


        if (
            data &&
            Array.isArray(data[0])
        ) {

            data[0].forEach(
                segment => {

                    if (
                        !Array.isArray(segment)
                    ) {

                        return;

                    }


                    if (
                        segment[0]
                    ) {

                        translation +=
                            segment[0];

                    }


                    if (
                        !segment[0]
                    ) {

                        if (
                            typeof segment[2] === "string" &&
                            segment[2].trim()
                        ) {

                            translit +=
                                segment[2];

                        }

                        else if (
                            typeof segment[3] === "string" &&
                            segment[3].trim()
                        ) {

                            translit +=
                                segment[3];

                        }

                    }

                }
            );

        }


        if (
            translation.trim()
        ) {

            const result = {

                translation:
                    translation.trim(),

                translit:
                    translit.trim()

            };


            try {

                localStorage.setItem(
                    cacheKey,
                    JSON.stringify(result)
                );

            } catch (error) {

                console.warn(
                    "Cache write failed:",
                    error
                );

            }


            return {
                ...result,
                provider: "google"
            };

        }

    } catch (error) {

        if (
            error &&
            error.name === "AbortError"
        ) {

            throw error;

        }

        console.warn(
            "Primary translation failed:",
            error
        );

    }


    const backupToggle =
        document.getElementById(
            "allowBackupToggle"
        );


    if (
        allowBackup &&
        backupToggle &&
        backupToggle.checked
    ) {

        try {

            const url =
                "https://api.mymemory.translated.net/get" +
                "?q=" +
                encodeURIComponent(text) +
                "&langpair=" +
                encodeURIComponent(sourceLang) +
                "|" +
                encodeURIComponent(targetLang);


            const response =
                await fetch(
                    url,
                    {
                        signal,
                        cache: "no-store"
                    }
                );


            if (response.ok) {

                const data =
                    await response.json();


                const translation =
                    data?.responseData?.translatedText;


                if (
                    translation &&
                    translation.trim()
                ) {

                    return {

                        translation:
                            translation.trim(),

                        translit: "",

                        provider:
                            "backup"

                    };

                }

            }

        } catch (error) {

            if (
                error &&
                error.name === "AbortError"
            ) {

                throw error;

            }

            console.warn(
                "Backup translation failed:",
                error
            );

        }

    }


    return null;

}



/* ================================================================
   JAPANESE READING / ROMAJI
   ================================================================ */

/*
 * This deliberately mirrors the Japanese reading behavior from the
 * original working Phrase Mapper.
 *
 * We ask Google for JA -> JA with dt=rm and read the phonetic
 * transliteration from the response. This request is kept separate
 * from normal translation caching and from the backup translator.
 */
async function getJapaneseReading(
    phrase
) {

    if (
        !phrase ||
        !phrase.trim()
    ) {

        return {
            romaji: "",
            hiragana: ""
        };

    }


    const url =
        "https://translate.googleapis.com/translate_a/single" +
        "?client=gtx" +
        "&sl=ja" +
        "&tl=ja" +
        "&dt=t" +
        "&dt=rm" +
        "&q=" +
        encodeURIComponent(
            phrase
        );


    /*
     * A couple of attempts are useful on iPhone, where this endpoint
     * can occasionally fail transiently.
     */
    for (
        let attempt = 0;
        attempt < 2;
        attempt++
    ) {

        try {

            const response =
                await fetch(
                    url,
                    {
                        cache: "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "Japanese reading request failed"
                );

            }


            const data =
                await response.json();


            let romaji = "";


            if (
                data &&
                Array.isArray(
                    data[0]
                )
            ) {

                data[0].forEach(
                    segment => {

                        if (
                            !Array.isArray(
                                segment
                            )
                        ) {

                            return;

                        }


                        /*
                         * This is the exact response pattern used by
                         * the original working version: Google's
                         * phonetic row is the segment where translated
                         * text is empty/null.
                         */
                        if (
                            !segment[0]
                        ) {

                            if (
                                segment[2] &&
                                typeof segment[2] === "string"
                            ) {

                                romaji =
                                    segment[2];

                            }

                            else if (
                                segment[3] &&
                                typeof segment[3] === "string"
                            ) {

                                romaji =
                                    segment[3];

                            }

                        }

                    }
                );

            }


            romaji =
                romaji.trim();


            if (
                romaji
            ) {

                let hiragana = "";


                if (
                    window.wanakana
                ) {

                    hiragana =
                        wanakana.toHiragana(
                            romaji
                        );

                }


                return {
                    romaji,
                    hiragana
                };

            }

        }

        catch (
            error
        ) {

            console.warn(
                `Japanese reading attempt ${attempt + 1} failed:`,
                error
            );

        }


        if (
            attempt === 0
        ) {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );

        }

    }


    /*
     * Kana-only fallback:
     * wanakana can safely convert kana, but it cannot determine
     * readings for kanji.
     */
    if (
        window.wanakana &&
        !/[一-龯々〆ヵヶ]/u.test(
            phrase
        )
    ) {

        const hiragana =
            wanakana.toHiragana(
                phrase
            );


        return {
            hiragana,
            romaji:
                wanakana.toRomaji(
                    hiragana
                )
        };

    }


    return {
        romaji: "",
        hiragana: ""
    };

}


/* ================================================================
   ENGLISH PHRASE BATCH TRANSLATION
   ================================================================ */

async function translateBatchFast(
    phrases,
    sourceLang,
    targetLang,
    options = {}
) {

    if (!phrases.length) {
        return [];
    }


    const allowBackup =
        options.allowBackup === true;


    /*
     * Google batch translation first for efficiency.
     * Backup is intentionally NOT used on the joined batch because
     * backup translators can rearrange or damage the delimiter.
     */
    const delimiter =
        " ###WARD_PHRASE### ";


    const joined =
        phrases.join(
            delimiter
        );


    const result =
        await translateUnified(
            joined,
            sourceLang,
            targetLang,
            {
                allowBackup: false
            }
        );


    if (
        result &&
        result.translation
    ) {

        const translations =
            result.translation.split(
                /\s*###WARD_PHRASE###\s*/i
            );


        const transliterations =
            result.translit
                ? result.translit.split(
                    /\s*###WARD_PHRASE###\s*/i
                )
                : [];


        /*
         * If Google preserved the delimiter, keep the efficient batch result.
         */
        if (
            phrases.length === 1 ||
            translations.length === phrases.length
        ) {

            return phrases.map(
                (_, index) => ({

                    translation:
                        translations[index]?.trim() || "",

                    translit:
                        transliterations[index]?.trim() || ""

                })
            );

        }

    }


    /*
     * If Google failed OR destroyed the delimiter, translate each card
     * individually. When the user has enabled backup, backup may now be
     * used here too. Individual translation keeps phrase/card alignment.
     */
    const individual =
        await Promise.all(
            phrases.map(
                phrase =>
                    translateUnified(
                        phrase,
                        sourceLang,
                        targetLang,
                        {
                            allowBackup
                        }
                    )
            )
        );


    return individual.map(
        item => ({

            translation:
                item?.translation || "",

            translit:
                item?.translit || ""

        })
    );

}


/* ================================================================

   ================================================================ */

function parseEnglishPhrases(text) {

    if (
        !text ||
        !text.trim()
    ) {

        return [];

    }


    text =
        text
            .trim()
            .replace(/\s+/g, " ");


    const words =
        text.split(" ");


    const phrases = [];

    let current = [];


    const conjunctions = new Set([

        "and",
        "but",
        "or",
        "nor",
        "yet",

        "because",
        "although",
        "though",

        "since",
        "while",
        "whereas",

        "if",
        "unless",
        "until",

        "when",
        "whenever",

        "that",
        "which",
        "who",
        "whom",

        "where",

        "so"

    ]);


    const prepositions = new Set([

        "in",
        "on",
        "at",
        "to",
        "for",
        "with",

        "about",
        "against",
        "between",
        "into",

        "through",
        "during",
        "before",
        "after",

        "above",
        "below",
        "from",

        "up",
        "down",
        "off",
        "over",
        "under",

        "by",
        "without",

        "within",
        "around",
        "among",

        "behind",
        "beside",
        "near",

        "toward",
        "towards",

        "upon",
        "across",
        "along",

        "inside",
        "outside",

        "past",
        "despite",
        "except"

    ]);


    const auxiliaries = new Set([

        "am",
        "is",
        "are",
        "was",
        "were",

        "be",
        "been",
        "being",

        "have",
        "has",
        "had",

        "do",
        "does",
        "did",

        "can",
        "could",

        "will",
        "would",

        "shall",
        "should",

        "may",
        "might",

        "must"

    ]);


    const pronouns = new Set([

        "i",
        "you",
        "he",
        "she",
        "it",
        "we",
        "they",

        "me",
        "him",
        "her",
        "us",
        "them"

    ]);


    const determiners = new Set([

        "a",
        "an",
        "the",

        "this",
        "that",
        "these",
        "those",

        "my",
        "your",
        "his",
        "her",
        "our",
        "their",

        "some",
        "any",
        "each",
        "every",
        "no"

    ]);


    function clean(word) {

        return word
            .toLowerCase()
            .replace(
                /^[^a-z']+|[^a-z']+$/g,
                ""
            );

    }


    function pushCurrent() {

        if (current.length) {

            phrases.push(
                current.join(" ")
            );

            current = [];

        }

    }


    function isPunctuation(word) {

        return /[,;:!?]/.test(word);

    }


    function isSentenceEnd(word) {

        return /[.!?]$/.test(word);

    }


    function nextWord(index) {

        if (
            index + 1 <
            words.length
        ) {

            return clean(
                words[index + 1]
            );

        }

        return "";

    }


    let i = 0;


    while (
        i < words.length
    ) {

        const word =
            words[i];

        const w =
            clean(word);

        const next =
            nextWord(i);


        /* --------------------------------------------------------
           PUNCTUATION
           -------------------------------------------------------- */

        if (
            isPunctuation(word)
        ) {

            current.push(word);

            pushCurrent();

            i++;

            continue;

        }


        /* --------------------------------------------------------
           CONJUNCTION
           -------------------------------------------------------- */

        if (
            conjunctions.has(w)
        ) {

            pushCurrent();

            phrases.push(word);

            i++;

            continue;

        }


        /* --------------------------------------------------------
           INFINITIVE
           
           "to go"
           "to eat"
           -------------------------------------------------------- */

        if (
            w === "to" &&
            next &&
            !prepositions.has(next)
        ) {

            pushCurrent();

            current.push(word);

            current.push(
                words[i + 1]
            );

            i += 2;

            pushCurrent();

            continue;

        }


        /* --------------------------------------------------------
           PREPOSITIONAL PHRASE
           
           "to the store"
           "with my friend"
           -------------------------------------------------------- */

        if (
            prepositions.has(w)
        ) {

            pushCurrent();

            const phrase = [word];

            let j = i + 1;


            while (
                j < words.length
            ) {

                const candidate =
                    words[j];

                const cw =
                    clean(candidate);


                if (
                    conjunctions.has(cw) ||
                    prepositions.has(cw)
                ) {

                    break;

                }


                phrase.push(
                    candidate
                );


                if (
                    isPunctuation(candidate)
                ) {

                    break;

                }


                if (
                    phrase.length >= 5
                ) {

                    break;

                }


                j++;

            }


            phrases.push(
                phrase.join(" ")
            );


            i = j;

            continue;

        }


        /* --------------------------------------------------------
           AUXILIARY + VERB
           -------------------------------------------------------- */

        if (
            auxiliaries.has(w) &&
            next &&
            !conjunctions.has(next)
        ) {

            pushCurrent();

            const phrase = [
                word,
                words[i + 1]
            ];


            let j = i + 2;


            if (
                j < words.length &&
                auxiliaries.has(
                    clean(words[j])
                )
            ) {

                phrase.push(
                    words[j]
                );

                j++;

            }


            phrases.push(
                phrase.join(" ")
            );


            i = j;

            continue;

        }


        /* --------------------------------------------------------
           PRONOUN + VERB
           -------------------------------------------------------- */

        if (
            pronouns.has(w) &&
            next &&
            !conjunctions.has(next) &&
            !prepositions.has(next)
        ) {

            pushCurrent();

            current.push(word);

            current.push(
                words[i + 1]
            );

            i += 2;

            continue;

        }


        /* --------------------------------------------------------
           DETERMINER + NOUN PHRASE
           -------------------------------------------------------- */

        if (
            determiners.has(w)
        ) {

            pushCurrent();

            const phrase = [word];

            let j = i + 1;


            while (
                j < words.length
            ) {

                const candidate =
                    words[j];

                const cw =
                    clean(candidate);


                if (
                    conjunctions.has(cw) ||
                    prepositions.has(cw)
                ) {

                    break;

                }


                phrase.push(
                    candidate
                );


                if (
                    phrase.length >= 4
                ) {

                    break;

                }


                if (
                    isPunctuation(candidate)
                ) {

                    break;

                }


                j++;

            }


            phrases.push(
                phrase.join(" ")
            );


            i = j;

            continue;

        }


        /* --------------------------------------------------------
           DEFAULT
           -------------------------------------------------------- */

        current.push(word);


        if (
            current.length >= 4
        ) {

            pushCurrent();

        }


        if (
            isSentenceEnd(word)
        ) {

            pushCurrent();

        }


        i++;

    }


    pushCurrent();


    return phrases.filter(
        phrase =>
            phrase.trim().length > 0
    );

}

   LANGUAGE-SPECIFIC TARGET PARSERS
   ================================================================ */

/*
 * Each target language gets its own parser.
 * This keeps parsing rules independent from translation logic.
 *
 * The parser contract is simple:
 *   parser(text) -> array of meaningful phrase strings
 */

function normalizeSpacedText(text) {
    return String(text || "")
        .trim()
        .replace(/\s+/g, " ");
}

function cleanToken(token) {
    return String(token || "")
        .toLowerCase()
        .replace(/^[^\p{L}\p{N}'’äöüßáéíóúàèìòùâêîôûçñ]+|[^\p{L}\p{N}'’äöüßáéíóúàèìòùâêîôûçñ]+$/gu, "");
}

function splitByPunctuation(text) {
    const source = normalizeSpacedText(text);
    if (!source) return [];

    const parts = source
        .split(/(?<=[.!?;:])\s+|,\s+/u)
        .map(x => x.trim())
        .filter(Boolean);

    return parts.length ? parts : [source];
}

function parseGermanPhrases(text) {
    const source = normalizeSpacedText(text);
    if (!source) return [];

    const words = source.split(" ");
    const phrases = [];

    const prepositions = new Set([
        "mit","zu","zum","zur","für","von","vom","bei","beim","in","im","ins",
        "an","am","ans","auf","aufs","nach","aus","über","unter","vor","hinter",
        "neben","wegen","ohne","gegen","um","durch","zwischen"
    ]);

    const conjunctions = new Set([
        "und","aber","oder","denn","weil","obwohl","wenn","dass","damit","während"
    ]);

    const articles = new Set([
        "der","die","das","den","dem","des",
        "ein","eine","einen","einem","einer","eines",
        "mein","meine","meinen","meinem","meiner",
        "dein","deine","sein","seine","ihr","ihre","unser","unsere"
    ]);

    const auxiliaries = new Set([
        "bin","bist","ist","sind","seid","war","waren",
        "habe","hast","hat","haben","hatte","hatten",
        "werde","wirst","wird","werden",
        "kann","kannst","können","muss","musst","müssen",
        "will","willst","wollen","soll","sollst","sollen",
        "möchte","möchtest","möchten","darf","dürfen"
    ]);

    let i = 0;
    while (i < words.length) {
        const word = words[i];
        const w = cleanToken(word);

        if (conjunctions.has(w)) {
            phrases.push(word);
            i++;
            continue;
        }

        if (prepositions.has(w)) {
            const chunk = [word];
            i++;
            while (i < words.length && chunk.length < 5) {
                const next = cleanToken(words[i]);
                if (conjunctions.has(next) || prepositions.has(next)) break;
                chunk.push(words[i]);
                i++;
                if (/[.!?;,]$/.test(chunk[chunk.length - 1])) break;
            }
            phrases.push(chunk.join(" "));
            continue;
        }

        if (auxiliaries.has(w) && i + 1 < words.length) {
            const chunk = [word, words[i + 1]];
            i += 2;

            // Catch common infinitive/complement structures without swallowing the sentence.
            if (i < words.length && cleanToken(words[i]) === "zu" && i + 1 < words.length) {
                chunk.push(words[i], words[i + 1]);
                i += 2;
            }

            phrases.push(chunk.join(" "));
            continue;
        }

        if (articles.has(w) && i + 1 < words.length) {
            const chunk = [word, words[i + 1]];
            i += 2;
            if (i < words.length && !prepositions.has(cleanToken(words[i])) &&
                !conjunctions.has(cleanToken(words[i])) && chunk.length < 4) {
                chunk.push(words[i]);
                i++;
            }
            phrases.push(chunk.join(" "));
            continue;
        }

        // Keep final separable prefixes attached visually to the preceding verb phrase when possible.
        if (i === words.length - 1 &&
            new Set(["an","auf","aus","ein","mit","nach","vor","weg","zurück","zu"]).has(w) &&
            phrases.length) {
            phrases[phrases.length - 1] += " " + word;
            i++;
            continue;
        }

        const chunk = [word];
        i++;
        while (i < words.length && chunk.length < 3) {
            const next = cleanToken(words[i]);
            if (prepositions.has(next) || conjunctions.has(next) || articles.has(next)) break;
            chunk.push(words[i]);
            i++;
            if (/[.!?;,]$/.test(chunk[chunk.length - 1])) break;
        }
        phrases.push(chunk.join(" "));
    }

    return phrases.filter(Boolean);
