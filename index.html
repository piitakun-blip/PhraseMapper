<script>

/* ================================================================
   GLOBAL STATE
   ================================================================ */

let currentLang = "de";

let translationTimeout = null;

let updateGeneration = 0;

const TRANSLATION_CACHE =
    "wardPhraseMapper:v18:";


/* ================================================================
   LANGUAGE CONFIG
   ================================================================ */

const LANG_CONFIG = {

    de: {
        name: "German",
        theme: "orange-mode"
    },

    ja: {
        name: "Japanese",
        theme: "sakura-mode"
    },

    es: {
        name: "Spanish",
        theme: "sangria-mode"
    },

    fr: {
        name: "French",
        theme: "lavender-mode"
    },

    it: {
        name: "Italian",
        theme: "emerald-mode"
    },

    ru: {
        name: "Russian",
        theme: "crimson-mode"
    },

    zh: {
        name: "Chinese",
        theme: "gold-mode"
    }

};


/* ================================================================
   HTML ESCAPE
   ================================================================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ================================================================
   SPEECH
   ================================================================ */

function speakText(inputId, langCode) {

    const element =
        document.getElementById(inputId);

    if (!element) return;

    const text =
        element.value.trim();

    if (
        !text ||
        !window.speechSynthesis
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = langCode;

    window.speechSynthesis.speak(
        utterance
    );

}


/* ================================================================
   TRANSLATION
   ================================================================ */

async function translateUnified(
    text,
    sourceLang,
    targetLang
) {

    if (!text || !text.trim()) {

        return {
            translation: "",
            translit: ""
        };

    }


    const cacheKey =
        TRANSLATION_CACHE +
        `${sourceLang}>${targetLang}:${text}`;


    /* ------------------------------------------------------------
       CACHE
       ------------------------------------------------------------ */

    try {

        const cached =
            localStorage.getItem(
                cacheKey
            );

        if (cached) {

            return JSON.parse(cached);

        }

    } catch (error) {

        console.warn(
            "Cache read failed:",
            error
        );

    }


    /* ------------------------------------------------------------
       GOOGLE
       ------------------------------------------------------------ */

    try {

        const url =
            "https://translate.googleapis.com/translate_a/single" +
            "?client=gtx" +
            "&sl=" +
            encodeURIComponent(sourceLang) +
            "&tl=" +
            encodeURIComponent(targetLang) +
            "&dt=t" +
            "&dt=rm" +
            "&q=" +
            encodeURIComponent(text);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Google translation failed"
            );

        }


        const data =
            await response.json();


        let translation = "";

        let translit = "";


        if (
            data &&
            data[0]
        ) {

            data[0].forEach(
                segment => {

                    if (
                        segment &&
                        segment[0]
                    ) {

                        translation +=
                            segment[0];

                    }


                    if (
                        segment &&
                        segment[2]
                    ) {

                        translit +=
                            segment[2];

                    }

                    else if (
                        segment &&
                        segment[3]
                    ) {

                        translit +=
                            segment[3];

                    }

                }
            );

        }


        if (
            translation.trim()
        ) {

            const result = {

                translation:
                    translation.trim(),

                translit:
                    translit.trim()

            };


            try {

                localStorage.setItem(
                    cacheKey,
                    JSON.stringify(result)
                );

            } catch (error) {

                console.warn(
                    "Cache write failed:",
                    error
                );

            }


            return result;

        }

    } catch (error) {

        console.warn(
            "Primary translation failed:",
            error
        );

    }


    /* ------------------------------------------------------------
       MYMEMORY BACKUP
       ------------------------------------------------------------ */

    const backup =
        document.getElementById(
            "allowBackupToggle"
        );


    if (
        backup &&
        backup.checked
    ) {

        try {

            const url =
                "https://api.mymemory.translated.net/get" +
                "?q=" +
                encodeURIComponent(text) +
                "&langpair=" +
                encodeURIComponent(sourceLang) +
                "|" +
                encodeURIComponent(targetLang);


            const response =
                await fetch(url);


            if (response.ok) {

                const data =
                    await response.json();


                const translation =
                    data?.responseData?.translatedText;


                if (translation) {

                    return {

                        translation:
                            translation.trim(),

                        translit: ""

                    };

                }

            }

        } catch (error) {

            console.warn(
                "Backup translation failed:",
                error
            );

        }

    }


    return null;

}


/* ================================================================
   ENGLISH PHRASE BATCH TRANSLATION
   ================================================================ */

async function translateBatchFast(
    phrases,
    sourceLang,
    targetLang
) {

    if (!phrases.length) {
        return [];
    }


    /*
     * The delimiter is deliberately unusual.
     */

    const delimiter =
        " ###WARD_PHRASE### ";


    const joined =
        phrases.join(delimiter);


    const result =
        await translateUnified(
            joined,
            sourceLang,
            targetLang
        );


    if (
        !result ||
        !result.translation
    ) {

        return phrases.map(
            () => ({
                translation: "",
                translit: ""
            })
        );

    }


    const translations =
        result.translation.split(
            /\s*###WARD_PHRASE###\s*/i
        );


    const transliterations =
        result.translit
            ? result.translit.split(
                /\s*###WARD_PHRASE###\s*/i
            )
            : [];


    /*
     * If Google destroyed the delimiter,
     * translate individually.
     */

    if (
        phrases.length > 1 &&
        translations.length !== phrases.length
    ) {

        const individual =
            await Promise.all(
                phrases.map(
                    phrase =>
                        translateUnified(
                            phrase,
                            sourceLang,
                            targetLang
                        )
                )
            );


        return individual.map(
            result => ({

                translation:
                    result?.translation || "",

                translit:
                    result?.translit || ""

            })
        );

    }


    return phrases.map(
        (_, index) => ({

            translation:
                translations[index]?.trim() || "",

            translit:
                transliterations[index]?.trim() || ""

        })
    );

}


/* ================================================================
   ENGLISH PARSER
   ================================================================ */

function parseEnglishPhrases(text) {

    if (
        !text ||
        !text.trim()
    ) {

        return [];

    }


    text =
        text
            .trim()
            .replace(/\s+/g, " ");


    const words =
        text.split(" ");


    const phrases = [];

    let current = [];


    const conjunctions = new Set([

        "and",
        "but",
        "or",
        "nor",
        "yet",

        "because",
        "although",
        "though",

        "since",
        "while",
        "whereas",

        "if",
        "unless",
        "until",

        "when",
        "whenever",

        "that",
        "which",
        "who",
        "whom",

        "where",

        "so"

    ]);


    const prepositions = new Set([

        "in",
        "on",
        "at",
        "to",
        "for",
        "with",

        "about",
        "against",
        "between",
        "into",

        "through",
        "during",
        "before",
        "after",

        "above",
        "below",
        "from",

        "up",
        "down",
        "off",
        "over",
        "under",

        "by",
        "without",

        "within",
        "around",
        "among",

        "behind",
        "beside",
        "near",

        "toward",
        "towards",

        "upon",
        "across",
        "along",

        "inside",
        "outside",

        "past",
        "despite",
        "except"

    ]);


    const auxiliaries = new Set([

        "am",
        "is",
        "are",
        "was",
        "were",

        "be",
        "been",
        "being",

        "have",
        "has",
        "had",

        "do",
        "does",
        "did",

        "can",
        "could",

        "will",
        "would",

        "shall",
        "should",

        "may",
        "might",

        "must"

    ]);


    const pronouns = new Set([

        "i",
        "you",
        "he",
        "she",
        "it",
        "we",
        "they",

        "me",
        "him",
        "her",
        "us",
        "them"

    ]);


    const determiners = new Set([

        "a",
        "an",
        "the",

        "this",
        "that",
        "these",
        "those",

        "my",
        "your",
        "his",
        "her",
        "our",
        "their",

        "some",
        "any",
        "each",
        "every",
        "no"

    ]);


    function clean(word) {

        return word
            .toLowerCase()
            .replace(
                /^[^a-z']+|[^a-z']+$/g,
                ""
            );

    }


    function pushCurrent() {

        if (current.length) {

            phrases.push(
                current.join(" ")
            );

            current = [];

        }

    }


    function isPunctuation(word) {

        return /[,;:!?]/.test(word);

    }


    function isSentenceEnd(word) {

        return /[.!?]$/.test(word);

    }


    function nextWord(index) {

        if (
            index + 1 <
            words.length
        ) {

            return clean(
                words[index + 1]
            );

        }

        return "";

    }


    let i = 0;


    while (
        i < words.length
    ) {

        const word =
            words[i];

        const w =
            clean(word);

        const next =
            nextWord(i);


        /* --------------------------------------------------------
           PUNCTUATION
           -------------------------------------------------------- */

        if (
            isPunctuation(word)
        ) {

            current.push(word);

            pushCurrent();

            i++;

            continue;

        }


        /* --------------------------------------------------------
           CONJUNCTION
           -------------------------------------------------------- */

        if (
            conjunctions.has(w)
        ) {

            pushCurrent();

            phrases.push(word);

            i++;

            continue;

        }


        /* --------------------------------------------------------
           INFINITIVE
           
           "to go"
           "to eat"
           -------------------------------------------------------- */

        if (
            w === "to" &&
            next &&
            !prepositions.has(next)
        ) {

            pushCurrent();

            current.push(word);

            current.push(
                words[i + 1]
            );

            i += 2;

            pushCurrent();

            continue;

        }


        /* --------------------------------------------------------
           PREPOSITIONAL PHRASE
           
           "to the store"
           "with my friend"
           -------------------------------------------------------- */

        if (
            prepositions.has(w)
        ) {

            pushCurrent();

            const phrase = [word];

            let j = i + 1;


            while (
                j < words.length
            ) {

                const candidate =
                    words[j];

                const cw =
                    clean(candidate);


                if (
                    conjunctions.has(cw) ||
                    prepositions.has(cw)
                ) {

                    break;

                }


                phrase.push(
                    candidate
                );


                if (
                    isPunctuation(candidate)
                ) {

                    break;

                }


                if (
                    phrase.length >= 5
                ) {

                    break;

                }


                j++;

            }


            phrases.push(
                phrase.join(" ")
            );


            i = j;

            continue;

        }


        /* --------------------------------------------------------
           AUXILIARY + VERB
           -------------------------------------------------------- */

        if (
            auxiliaries.has(w) &&
            next &&
            !conjunctions.has(next)
        ) {

            pushCurrent();

            const phrase = [
                word,
                words[i + 1]
            ];


            let j = i + 2;


            if (
                j < words.length &&
                auxiliaries.has(
                    clean(words[j])
                )
            ) {

                phrase.push(
                    words[j]
                );

                j++;

            }


            phrases.push(
                phrase.join(" ")
            );


            i = j;

            continue;

        }


        /* --------------------------------------------------------
           PRONOUN + VERB
           -------------------------------------------------------- */

        if (
            pronouns.has(w) &&
            next &&
            !conjunctions.has(next) &&
            !prepositions.has(next)
        ) {

            pushCurrent();

            current.push(word);

            current.push(
                words[i + 1]
            );

            i += 2;

            continue;

        }


        /* --------------------------------------------------------
           DETERMINER + NOUN PHRASE
           -------------------------------------------------------- */

        if (
            determiners.has(w)
        ) {

            pushCurrent();

            const phrase = [word];

            let j = i + 1;


            while (
                j < words.length
            ) {

                const candidate =
                    words[j];

                const cw =
                    clean(candidate);


                if (
                    conjunctions.has(cw) ||
                    prepositions.has(cw)
                ) {

                    break;

                }


                phrase.push(
                    candidate
                );


                if (
                    phrase.length >= 4
                ) {

                    break;

                }


                if (
                    isPunctuation(candidate)
                ) {

                    break;

                }


                j++;

            }


            phrases.push(
                phrase.join(" ")
            );


            i = j;

            continue;

        }


        /* --------------------------------------------------------
           DEFAULT
           -------------------------------------------------------- */

        current.push(word);


        if (
            current.length >= 4
        ) {

            pushCurrent();

        }


        if (
            isSentenceEnd(word)
        ) {

            pushCurrent();

        }


        i++;

    }


    pushCurrent();


    return phrases.filter(
        phrase =>
            phrase.trim().length > 0
    );

}


/* ================================================================
   JAPANESE CHARACTER HELPERS
   ================================================================ */

function isJapaneseCharacter(char) {

    return /[\u3040-\u30ff\u3400-\u9fff々ー]/.test(
        char
    );

}


function isKanji(char) {

    return /[\u3400-\u4dbf\u4e00-\u9fff]/.test(
        char
    );

}


function isKana(char) {

    return /[\u3040-\u30ff]/.test(
        char
    );

}


/* ================================================================
   JAPANESE PARSER
   ================================================================ */

function parseJapanesePhrases(text) {

    if (
        !text ||
        !text.trim()
    ) {

        return [];

    }


    /*
     * Japanese normally has no spaces.
     * Remove spaces that Google may have inserted.
     */

    const source =
        text
            .trim()
            .replace(/\s+/g, "");


    const phrases = [];

    let current = "";


    /*
     * Japanese particles.
     *
     * Longer particles come first.
     */

    const particles = [

        "について",
        "に対して",
        "によって",
        "として",
        "にとって",
        "において",
        "までに",
        "のために",
        "から",
        "まで",
        "より",
        "だけ",
        "しか",
        "ほど",
        "など",
        "なんて",
        "なんか",

        "では",
        "には",
        "へ",
        "と",
        "が",
        "を",
        "に",
        "で",
        "は",
        "も"

    ];


    /*
     * Japanese clause-ending expressions.
     */

    const clauseEndings = [

        "ので",
        "のに",
        "けれども",
        "けれど",
        "けど",
        "から",
        "ので",
        "なら",
        "ならば",
        "たら",
        "ても",
        "でも",
        "ながら",
        "し",
        "が"

    ];


    /*
     * Common sentence endings.
     */

    const sentenceEndings = [

        "です",
        "ます",
        "でした",
        "ました",
        "ません",
        "ませんでした",

        "たい",
        "たくない",

        "ない",
        "なかった",

        "だった",
        "だ",

        "でしょう",
        "だろう",

        "ください",
        "下さい",

        "ませんか",
        "ましょう",

        "たいです",
        "たくないです"

    ];


    function startsWithAt(
        value,
        index,
        candidate
    ) {

        return value.startsWith(
            candidate,
            index
        );

    }


    function flush() {

        if (
            current.trim()
        ) {

            phrases.push(
                current.trim()
            );

            current = "";

        }

    }


    let i = 0;


    while (
        i < source.length
    ) {

        const char =
            source[i];


        current += char;


        /* --------------------------------------------------------
           PUNCTUATION
           -------------------------------------------------------- */

        if (
            /[。！？]/.test(char)
        ) {

            flush();

            i++;

            continue;

        }


        /* --------------------------------------------------------
           COMMA
           
           Japanese comma is useful as a clause boundary,
           but not always a phrase boundary.
           -------------------------------------------------------- */

        if (
            char === "、"
        ) {

            /*
             * If the current phrase is reasonably long,
             * treat it as a clause boundary.
             */

            if (
                current.length >= 4
            ) {

                flush();

            }

            i++;

            continue;

        }


        /* --------------------------------------------------------
           CLAUSE ENDINGS
           
           Examples:
           
           必要なので
           行きたいけど
           食べたから
           -------------------------------------------------------- */

        let matchedClause =
            null;


        for (
            const ending
            of clauseEndings
        ) {

            if (
                startsWithAt(
                    source,
                    i,
                    ending
                )
            ) {

                matchedClause =
                    ending;

                break;

            }

        }


        if (
            matchedClause
        ) {

            /*
             * Consume the remaining characters
             * of the expression.
             */

            for (
                let j = 1;
                j < matchedClause.length;
                j++
            ) {

                i++;

                current +=
                    source[i];

            }


            /*
             * Clause endings are useful boundaries.
             */

            if (
                current.length >= 3
            ) {

                flush();

            }


            i++;

            continue;

        }


        /* --------------------------------------------------------
           PARTICLES
           -------------------------------------------------------- */

        let matchedParticle =
            null;


        for (
            const particle
            of particles
        ) {

            if (
                startsWithAt(
                    source,
                    i,
                    particle
                )
            ) {

                matchedParticle =
                    particle;

                break;

            }

        }


        if (
            matchedParticle
        ) {

            /*
             * Consume multi-character particle.
             */

            for (
                let j = 1;
                j < matchedParticle.length;
                j++
            ) {

                i++;

                current +=
                    source[i];

            }


            /*
             * Important:
             *
             * Do NOT split on は / が / を automatically.
             *
             * Japanese phrases such as:
             *
             * 私は学生です
             * 牛乳が必要です
             * 本を読みます
             *
             * need their predicate.
             *
             * Instead, split on location/action particles
             * when the current chunk already contains enough
             * material.
             */

            if (
                matchedParticle === "に" ||
                matchedParticle === "で" ||
                matchedParticle === "へ" ||
                matchedParticle === "まで" ||
                matchedParticle === "から"
            ) {

                /*
                 * Don't split tiny chunks.
                 */

                if (
                    current.length >= 3
                ) {

                    flush();

                }

            }


            i++;

            continue;

        }


        /* --------------------------------------------------------
           SENTENCE ENDINGS
           -------------------------------------------------------- */

        let matchedEnding =
            null;


        for (
            const ending
            of sentenceEndings
        ) {

            if (
                source.startsWith(
                    ending,
                    i
                )
            ) {

                matchedEnding =
                    ending;

                break;

            }

        }


        if (
            matchedEnding
        ) {

            /*
             * Consume ending.
             */

            for (
                let j = 1;
                j < matchedEnding.length;
                j++
            ) {

                i++;

                current +=
                    source[i];

            }


            /*
             * Don't always flush here.
             *
             * We want:
             *
             * 行きたいです
             *
             * as one phrase.
             *
             * But if the sentence has already become
             * very long, flush it.
             */

            if (
                current.length >= 8
            ) {

                flush();

            }


            i++;

            continue;

        }


        /*
         * --------------------------------------------------------
         * LONG-CHUNK SAFETY
         * --------------------------------------------------------
         *
         * Prevent an entire long Japanese sentence from
         * becoming one card.
         */

        if (
            current.length >= 12
        ) {

            /*
             * Prefer breaking at a kana/kanji transition.
             */

            const previous =
                source[i - 1] || "";

            const currentChar =
                source[i];


            if (
                isKanji(previous) &&
                isKana(currentChar)
            ) {

                flush();

            }

        }


        i++;

    }


    flush();


    /*
     * ------------------------------------------------------------
     * CLEAN UP
     * ------------------------------------------------------------
     */

    let cleaned =
        phrases
            .map(
                phrase =>
                    phrase
                        .replace(
                            /^、+/,
                            ""
                        )
                        .trim()
            )
            .filter(Boolean);


    /*
     * If the parser produced only one enormous chunk,
     * perform a safer fallback split around particles.
     */

    if (
        cleaned.length === 1 &&
        cleaned[0].length > 15
    ) {

        cleaned =
            japaneseFallbackSplit(
                cleaned[0]
            );

    }


    return cleaned;

}


/* ================================================================
   JAPANESE FALLBACK SPLITTER
   ================================================================ */

function japaneseFallbackSplit(text) {

    if (
        !text ||
        text.length <= 1
    ) {

        return text
            ? [text]
            : [];

    }


    const result = [];

    let current = "";


    const boundaryParticles = [
        "に",
        "で",
        "へ",
        "と",
        "から",
        "まで"
    ];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        current += char;


        if (
            boundaryParticles.includes(
                char
            ) &&
            current.length >= 3
        ) {

            /*
             * Don't split if the next character appears
             * to be part of a common grammatical ending.
             */

            const next =
                text[i + 1] || "";


            if (
                next &&
                /[ぁ-ん]/.test(next)
            ) {

                continue;

            }


            result.push(
                current
            );

            current = "";

        }

    }


    if (
        current
    ) {

        result.push(
            current
        );

    }


    return result.filter(
        x => x.trim()
    );

}


/* ================================================================
   RENDER ENGLISH MAP
   ================================================================ */

function renderEnglishMap(
    phrases
) {

    const grid =
        document.getElementById(
            "englishOutput"
        );


    if (
        !phrases.length
    ) {

        grid.innerHTML = `
            <div class="empty-message">
                Enter an English sentence above.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        phrases
            .map(
                (phrase, index) => `

                    <div
                        class="word-card english-card"
                    >

                        <div
                            class="phrase-text"
                        >
                            ${escapeHTML(
                                phrase
                            )}
                        </div>

                        <div
                            class="phrase-translation"
                            id="eng-p-${index}"
                        >
                            ...
                        </div>

                    </div>

                `
            )
            .join("");

}


/* ================================================================
   RENDER FOREIGN MAP
   ================================================================ */

function renderForeignMap(
    phrases
) {

    const grid =
        document.getElementById(
            "foreignOutput"
        );


    const config =
        LANG_CONFIG[currentLang];


    if (
        !phrases.length
    ) {

        grid.innerHTML = `
            <div class="empty-message">
                Translation will appear here.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        phrases
            .map(
                (phrase, index) => `

                    <div
                        class="word-card foreign-card ${config.theme}"
                    >

                        <div
                            class="phrase-text"
                            id="foreign-phrase-${index}"
                        >
                            ${escapeHTML(
                                phrase
                            )}
                        </div>

                        <div
                            class="phrase-reading"
                            id="for-r-${index}"
                        ></div>

                        <div
                            class="phrase-romaji"
                            id="for-rom-${index}"
                        ></div>

                        <div
                            class="phrase-translation"
                            id="for-p-${index}"
                        ></div>

                    </div>

                `
            )
            .join("");

}


/* ================================================================
   UPDATE PHRASE MAPS
   ================================================================ */

async function updatePhraseMaps() {

    const generation =
        ++updateGeneration;


    const englishText =
        document
            .getElementById(
                "englishInput"
            )
            .value
            .trim();


    const foreignText =
        document
            .getElementById(
                "foreignInput"
            )
            .value
            .trim();


    /*
     * ------------------------------------------------------------
     * ENGLISH PARSING
     * ------------------------------------------------------------
     */

    const englishPhrases =
        parseEnglishPhrases(
            englishText
        );


    /*
     * ------------------------------------------------------------
     * TARGET PARSING
     *
     * Japanese gets its own routine.
     * ------------------------------------------------------------
     */

    let foreignPhrases = [];


    if (
        currentLang === "ja"
    ) {

        foreignPhrases =
            parseJapanesePhrases(
                foreignText
            );

    }

    else {

        foreignPhrases =
            parseForeignPhrases(
                foreignText
            );

    }


    renderEnglishMap(
        englishPhrases
    );


    /*
     * ------------------------------------------------------------
     * TRANSLATE ENGLISH PHRASES
     * ------------------------------------------------------------
     */

    if (
        englishPhrases.length
    ) {

        const translated =
            await translateBatchFast(
                englishPhrases,
                "en",
                currentLang
            );


        if (
            generation !==
            updateGeneration
        ) {

            return;

        }


        translated.forEach(
            (result, index) => {

                const element =
                    document.getElementById(
                        `eng-p-${index}`
                    );


                if (element) {

                    element.innerText =
                        result?.translation ||
                        "";

                }

            }
        );

    }


    /*
     * ------------------------------------------------------------
     * JAPANESE TARGET MAP
     *
     * Japanese should display the user's actual Japanese
     * sentence rather than attempting to manufacture Japanese
     * chunks from English.
     * ------------------------------------------------------------
     */

    if (
        currentLang === "ja"
    ) {

        renderForeignMap(
            foreignPhrases
        );


        foreignPhrases.forEach(
            (phrase, index) => {

                const phraseElement =
                    document.getElementById(
                        `foreign-phrase-${index}`
                    );


                const readingElement =
                    document.getElementById(
                        `for-r-${index}`
                    );


                const romajiElement =
                    document.getElementById(
                        `for-rom-${index}`
                    );


                const translationElement =
                    document.getElementById(
                        `for-p-${index}`
                    );


                /*
                 * Japanese reading.
                 */

                if (
                    phraseElement
                ) {

                    phraseElement.innerText =
                        phrase;

                }


                if (
                    window.wanakana
                ) {

                    const hiragana =
                        wanakana.toHiragana(
                            phrase
                        );


                    const romaji =
                        wanakana.toRomaji(
                            phrase
                        );


                    if (
                        readingElement
                    ) {

                        /*
                         * Only show Hiragana when it differs
                         * from the original.
                         */

                        readingElement.innerText =
                            hiragana !== phrase
                                ? hiragana
                                : "";

                    }


                    if (
                        romajiElement
                    ) {

                        romajiElement.innerText =
                            romaji;

                    }

                }


                /*
                 * Translate the Japanese phrase back to
                 * English for the explanation under the card.
                 */

                translateUnified(
                    phrase,
                    "ja",
                    "en"
                )
                .then(
                    result => {

                        if (
                            generation !==
                            updateGeneration
                        ) {

                            return;

                        }


                        if (
                            translationElement
                        ) {

                            translationElement.innerText =
                                result?.translation ||
                                "";

                        }

                    }
                );

            }
        );


        /*
         * Re-translation of complete Japanese sentence.
         */

        if (
            foreignText
        ) {

            const retrans =
                await translateUnified(
                    foreignText,
                    "ja",
                    "en"
                );


            if (
                generation !==
                updateGeneration
            ) {

                return;

            }


            document.getElementById(
                "retranslationText"
            ).innerText =
                retrans
                    ? retrans.translation
                    : "Re-translation failed";

        }


        setStatus(
            `${englishPhrases.length} English phrase${
                englishPhrases.length === 1
                    ? ""
                    : "s"
            } • ${
                foreignPhrases.length
            } Japanese phrase${
                foreignPhrases.length === 1
                    ? ""
                    : "s"
            }`
        );


        return;

    }


    /*
     * ------------------------------------------------------------
     * OTHER LANGUAGES
     * ------------------------------------------------------------
     */

    renderForeignMap(
        foreignPhrases
    );


    if (
        foreignPhrases.length
    ) {

        const translatedForeign =
            await translateBatchFast(
                foreignPhrases,
                currentLang,
                "en"
            );


        if (
            generation !==
            updateGeneration
        ) {

            return;

        }


        foreignPhrases.forEach(
            (phrase, index) => {

                const result =
                    translatedForeign[index] ||
                    {};


                const translationElement =
                    document.getElementById(
                        `for-p-${index}`
                    );


                const readingElement =
                    document.getElementById(
                        `for-r-${index}`
                    );


                if (
                    translationElement
                ) {

                    translationElement.innerText =
                        result.translation ||
                        "";

                }


                if (
                    result.translit &&
                    readingElement
                ) {

                    readingElement.innerText =
                        result.translit;

                }

            }
        );

    }


    /*
     * ------------------------------------------------------------
     * COMPLETE TARGET → ENGLISH RETRANSLATION
     * ------------------------------------------------------------
     */

    if (
        foreignText
    ) {

        const retrans =
            await translateUnified(
                foreignText,
                currentLang,
                "en"
            );


        if (
            generation !==
            updateGeneration
        ) {

            return;

        }


        document.getElementById(
            "retranslationText"
        ).innerText =
            retrans
                ? retrans.translation
                : "Re-translation failed";

    }

    else {

        document.getElementById(
            "retranslationText"
        ).innerHTML =
            "<em>Re-translation will appear here...</em>";

    }


    setStatus(
        `${englishPhrases.length} English phrase${
            englishPhrases.length === 1
                ? ""
                : "s"
        }`
    );

}


/* ================================================================
   INPUT HANDLING
   ================================================================ */

function handleInput(lang) {

    clearTimeout(
        translationTimeout
    );


    translationTimeout =
        setTimeout(
            async () => {

                const auto =
                    document.getElementById(
                        "autoTranslateToggle"
                    ).checked;


                const englishInput =
                    document.getElementById(
                        "englishInput"
                    );


                const foreignInput =
                    document.getElementById(
                        "foreignInput"
                    );


                /*
                 * ENGLISH → TARGET
                 */

                if (
                    lang === "en" &&
                    auto &&
                    englishInput.value.trim()
                ) {

                    setStatus(
                        "Translating..."
                    );


                    const result =
                        await translateUnified(
                            englishInput.value.trim(),
                            "en",
                            currentLang
                        );


                    if (
                        result
                    ) {

                        foreignInput.value =
                            result.translation;

                    }

                }


                /*
                 * TARGET → ENGLISH
                 */

                else if (
                    lang === "foreign" &&
                    auto &&
                    foreignInput.value.trim()
                ) {

                    setStatus(
                        "Translating..."
                    );


                    const result =
                        await translateUnified(
                            foreignInput.value.trim(),
                            currentLang,
                            "en"
                        );


                    if (
                        result
                    ) {

                        englishInput.value =
                            result.translation;

                    }

                }


                /*
                 * Update everything.
                 */

                await updatePhraseMaps();

            },
            350
        );

}


/* ================================================================
   LANGUAGE SWITCHING
   ================================================================ */

function setLanguage(lang) {

    if (
        !LANG_CONFIG[lang]
    ) {

        return;

    }


    currentLang =
        lang;


    const config =
        LANG_CONFIG[lang];


    /*
     * Titles.
     */

    document.getElementById(
        "mainTitle"
    ).innerText =
        `EN ➜ ${lang.toUpperCase()}: Ward's Phrasen-Mapper`;


    document.getElementById(
        "foreignLabel"
    ).innerText =
        `${config.name} Sentence`;


    document.getElementById(
        "foreignRowTitle"
    ).innerText =
        `${config.name} Phrase Map`;


    /*
     * Button states.
     */

    Object.keys(
        LANG_CONFIG
    ).forEach(
        code => {

            const button =
                document.getElementById(
                    "btn" +
                    code.toUpperCase()
                );


            if (!button) {
                return;
            }


            button.className =
                "lang-btn";


            if (
                code === lang
            ) {

                button.classList.add(
                    "active",
                    config.theme
                );

            }

        }
    );


    /*
     * Re-run translation if English exists.
     */

    const english =
        document.getElementById(
            "englishInput"
        ).value.trim();


    if (
        english
    ) {

        handleInput("en");

    }

    else {

        updatePhraseMaps();

    }

}


/* ================================================================
   STATUS
   ================================================================ */

function setStatus(message) {

    const element =
        document.getElementById(
            "statusText"
        );


    if (element) {

        element.innerText =
            message;

    }

}


/* ================================================================
   INITIALIZE
   ================================================================ */

setLanguage("de");

</script>
