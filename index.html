            ) {

                result.push(
                    current
                );

                current =
                    matchedBoundary;

                i +=
                    matchedBoundary.length;

                continue;

            }


            if (
                matchedBoundary
            ) {

                current +=
                    matchedBoundary;

                i +=
                    matchedBoundary.length;

            }

            else {

                current +=
                    clause[i];

                i++;

            }


            if (
                current.length >= 6
            ) {

                result.push(
                    current
                );

                current = "";

            }

        }


        if (
            current
        ) {

            result.push(
                current
            );

        }

    }

    return result.filter(Boolean);
}


/* ================================================================
   TARGET PARSER REGISTRY
   ================================================================ */

const TARGET_PARSERS = {
    de: parseGermanPhrases,
    ja: parseJapanesePhrases,
    es: parseSpanishPhrases,
    fr: parseFrenchPhrases,
    it: parseItalianPhrases,
    ru: parseRussianPhrases,
    zh: parseChinesePhrases
};

function parseTargetPhrases(text, lang = currentLang) {
    const parser = TARGET_PARSERS[lang];

    if (typeof parser === "function") {
        return parser(text);
    }

    // Conservative fallback if a language is ever added without a parser.
    return splitByPunctuation(text);
}


/* ================================================================
   JAPANESE CHARACTER HELPERS
   ================================================================ */

function isJapaneseCharacter(char) {

    return /[\u3040-\u30ff\u3400-\u9fff々ー]/.test(
        char
    );

}


function isKanji(char) {

    return /[\u3400-\u4dbf\u4e00-\u9fff]/.test(
        char
    );

}


function isKana(char) {

    return /[\u3040-\u30ff]/.test(
        char
    );

}


/* ================================================================
   JAPANESE PARSER
   ================================================================ */

function parseJapanesePhrases(text) {

    if (
        !text ||
        !text.trim()
    ) {

        return [];

    }


    /*
     * Japanese normally has no spaces.
     * Remove spaces that Google may have inserted.
     */

    const source =
        text
            .trim()
            .replace(/\s+/g, "");


    const phrases = [];

    let current = "";


    /*
     * Japanese particles.
     *
     * Longer particles come first.
     */

    const particles = [

        "について",
        "に対して",
        "によって",
        "として",
        "にとって",
        "において",
        "までに",
        "のために",
        "から",
        "まで",
        "より",
        "だけ",
        "しか",
        "ほど",
        "など",
        "なんて",
        "なんか",

        "では",
        "には",
        "へ",
        "と",
        "が",
        "を",
        "に",
        "で",
        "は",
        "も"

    ];


    /*
     * Japanese clause-ending expressions.
     */

    const clauseEndings = [

        "ので",
        "のに",
        "けれども",
        "けれど",
        "けど",
        "から",
        "ので",
        "なら",
        "ならば",
        "たら",
        "ても",
        "でも",
        "ながら",
        "し",
        "が"

    ];


    /*
     * Common sentence endings.
     */

    const sentenceEndings = [

        "です",
        "ます",
        "でした",
        "ました",
        "ません",
        "ませんでした",

        "たい",
        "たくない",

        "ない",
        "なかった",

        "だった",
        "だ",

        "でしょう",
        "だろう",

        "ください",
        "下さい",

        "ませんか",
        "ましょう",

        "たいです",
        "たくないです"

    ];


    function startsWithAt(
        value,
        index,
        candidate
    ) {

        return value.startsWith(
            candidate,
            index
        );

    }


    function flush() {

        if (
            current.trim()
        ) {

            phrases.push(
                current.trim()
            );

            current = "";

        }

    }


    let i = 0;


    while (
        i < source.length
    ) {

        const char =
            source[i];


        current += char;


        /* --------------------------------------------------------
           PUNCTUATION
           -------------------------------------------------------- */

        if (
            /[。！？]/.test(char)
        ) {

            flush();

            i++;

            continue;

        }


        /* --------------------------------------------------------
           COMMA
           
           Japanese comma is useful as a clause boundary,
           but not always a phrase boundary.
           -------------------------------------------------------- */

        if (
            char === "、"
        ) {

            /*
             * If the current phrase is reasonably long,
             * treat it as a clause boundary.
             */

            if (
                current.length >= 4
            ) {

                flush();

            }

            i++;

            continue;

        }


        /* --------------------------------------------------------
           CLAUSE ENDINGS
           
           Examples:
           
           必要なので
           行きたいけど
           食べたから
           -------------------------------------------------------- */

        let matchedClause =
            null;


        for (
            const ending
            of clauseEndings
        ) {

            if (
                startsWithAt(
                    source,
                    i,
                    ending
                )
            ) {

                matchedClause =
                    ending;

                break;

            }

        }


        if (
            matchedClause
        ) {

            /*
             * Consume the remaining characters
             * of the expression.
             */

            for (
                let j = 1;
                j < matchedClause.length;
                j++
            ) {

                i++;

                current +=
                    source[i];

            }


            /*
             * Clause endings are useful boundaries.
             */

            if (
                current.length >= 3
            ) {

                flush();

            }


            i++;

            continue;

        }


        /* --------------------------------------------------------
           PARTICLES
           -------------------------------------------------------- */

        /*
         * Important Japanese guard:
         * Do not treat the first character of a grammatical ending
         * as a standalone particle.
         *
         * Without this, endings such as:
         *   です
         *   でした
         *   でしょう
         *
         * can be split at で, leaving an isolated す. Google may then
         * interpret that standalone す as 酢 ("vinegar").
         */
        const beginsSentenceEnding =
            sentenceEndings.some(
                ending =>
                    source.startsWith(
                        ending,
                        i
                    )
            );

        let matchedParticle =
            null;


        if (
            !beginsSentenceEnding
        ) {

            for (
                const particle
                of particles
            ) {

                if (
                    startsWithAt(
                        source,
                        i,
                        particle
                    )
                ) {

                    matchedParticle =
                        particle;

                    break;

                }

            }

        }


        if (
            matchedParticle
        ) {

            /*
             * Consume multi-character particle.
             */

            for (
                let j = 1;
                j < matchedParticle.length;
                j++
            ) {

                i++;

                current +=
                    source[i];

            }


            /*
             * Important:
             *
             * Do NOT split on は / が / を automatically.
             *
             * Japanese phrases such as:
             *
             * 私は学生です
             * 牛乳が必要です
             * 本を読みます
             *
             * need their predicate.
             *
             * Instead, split on location/action particles
             * when the current chunk already contains enough
             * material.
             */

            if (
                matchedParticle === "に" ||
                matchedParticle === "で" ||
                matchedParticle === "へ" ||
                matchedParticle === "まで" ||
                matchedParticle === "から"
            ) {

                /*
                 * Don't split tiny chunks.
                 */

                if (
                    current.length >= 3
                ) {

                    flush();

                }

            }


            i++;

            continue;

        }


        /* --------------------------------------------------------
           SENTENCE ENDINGS
           -------------------------------------------------------- */

        let matchedEnding =
            null;


        for (
            const ending
            of sentenceEndings
        ) {

            if (
                source.startsWith(
                    ending,
                    i
                )
            ) {

                matchedEnding =
                    ending;

                break;

            }

        }


        if (
            matchedEnding
        ) {

            /*
             * Consume ending.
             */

            for (
                let j = 1;
                j < matchedEnding.length;
                j++
            ) {

                i++;

                current +=
                    source[i];

            }


            /*
             * Don't always flush here.
             *
             * We want:
             *
             * 行きたいです
             *
             * as one phrase.
             *
             * But if the sentence has already become
             * very long, flush it.
             */

            if (
                current.length >= 8
            ) {

                flush();

            }


            i++;

            continue;

        }


        /*
         * --------------------------------------------------------
         * LONG-CHUNK SAFETY
         * --------------------------------------------------------
         *
         * Prevent an entire long Japanese sentence from
         * becoming one card.
         */

        if (
            current.length >= 12
        ) {

            /*
             * Prefer breaking at a kana/kanji transition.
             */

            const previous =
                source[i - 1] || "";

            const currentChar =
                source[i];


            if (
                isKanji(previous) &&
                isKana(currentChar)
            ) {

                flush();

            }

        }


        i++;

    }


    flush();


    /*
     * ------------------------------------------------------------
     * CLEAN UP
     * ------------------------------------------------------------
     */

    let cleaned =
        phrases
            .map(
                phrase =>
                    phrase
                        .replace(
                            /^、+/,
                            ""
                        )
                        .trim()
            )
            .filter(Boolean);

    /*
     * Safety cleanup:
     * A bare す should never be a useful phrase card in this mapper.
     * If one somehow survives parsing, attach it to the previous phrase
     * instead of sending "す" alone to translation.
     */
    cleaned =
        cleaned.reduce(
            (result, phrase) => {

                if (
                    phrase === "す" &&
                    result.length
                ) {

                    result[
                        result.length - 1
                    ] += phrase;

                }

                else {

                    result.push(
                        phrase
                    );

                }

                return result;

            },
            []
        );


    /*
     * If the parser produced only one enormous chunk,
     * perform a safer fallback split around particles.
     */

    if (
        cleaned.length === 1 &&
        cleaned[0].length > 15
    ) {

        cleaned =
            japaneseFallbackSplit(
                cleaned[0]
            );

    }


    return cleaned;

}


/* ================================================================
   JAPANESE FALLBACK SPLITTER
   ================================================================ */

function japaneseFallbackSplit(text) {

    if (
        !text ||
        text.length <= 1
    ) {

        return text
            ? [text]
            : [];

    }


    const result = [];

    let current = "";


    const boundaryParticles = [
        "に",
        "で",
        "へ",
        "と",
        "から",
        "まで"
    ];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        current += char;


        if (
            boundaryParticles.includes(
                char
            ) &&
            current.length >= 3
        ) {

            /*
             * Don't split if the next character appears
             * to be part of a common grammatical ending.
             */

            const next =
                text[i + 1] || "";


            if (
                next &&
                /[ぁ-ん]/.test(next)
            ) {

                continue;

            }


            result.push(
                current
            );

            current = "";

        }

    }


    if (
        current
    ) {

        result.push(
            current
        );

    }


    return result.filter(
        x => x.trim()
    );

}


/* ================================================================
   RENDER ENGLISH MAP
   ================================================================ */

function renderEnglishMap(
    phrases
) {

    const grid =
        document.getElementById(
            "englishOutput"
        );


    if (
        !phrases.length
    ) {

        grid.innerHTML = `
            <div class="empty-message">
                Enter an English sentence above.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        phrases
            .map(
                (phrase, index) => `

                    <div
                        class="word-card english-card"
                    >

                        <div
                            class="phrase-text"
                        >
                            ${escapeHTML(
                                phrase
                            )}
                        </div>

                        <div
                            class="phrase-translation"
                            id="eng-p-${index}"
                        >
                            ...
                        </div>

                    </div>

                `
            )
            .join("");

}


/* ================================================================
   RENDER FOREIGN MAP
   ================================================================ */

function renderForeignMap(
    phrases
) {

    const grid =
        document.getElementById(
            "foreignOutput"
        );


    const config =
        LANG_CONFIG[currentLang];


    if (
        !phrases.length
    ) {

        grid.innerHTML = `
            <div class="empty-message">
                Translation will appear here.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        phrases
            .map(
                (phrase, index) => `

                    <div
                        class="word-card foreign-card ${config.theme}"
                    >

                        <div
                            class="phrase-text"
                            id="foreign-phrase-${index}"
                        >
                            ${escapeHTML(
                                phrase
                            )}
                        </div>

                        <div
                            class="phrase-reading"
                            id="for-r-${index}"
                        ></div>

                        <div
                            class="phrase-romaji"
                            id="for-rom-${index}"
                        ></div>

                        <div
                            class="phrase-translation"
                            id="for-p-${index}"
                        ></div>

                    </div>

                `
            )
            .join("");

}


/* ================================================================
   UPDATE PHRASE MAPS
   ================================================================ */

async function updatePhraseMaps() {

    const generation =
        ++updateGeneration;


    const englishText =
        document
            .getElementById(
                "englishInput"
            )
            .value
            .trim();


    const foreignText =
        document
            .getElementById(
                "foreignInput"
            )
            .value
            .trim();


    /*
     * ------------------------------------------------------------
     * ENGLISH PARSING
     * ------------------------------------------------------------
     */

    const englishPhrases =
        parseEnglishPhrases(
            englishText
        );


    /*
     * ------------------------------------------------------------
     * TARGET PARSING
     *
     * Japanese gets its own routine.
     * ------------------------------------------------------------
     */

    const foreignPhrases =
        parseTargetPhrases(
            foreignText,
            currentLang
        );


    renderEnglishMap(
        englishPhrases
    );


    /*
     * ------------------------------------------------------------
     * TRANSLATE ENGLISH PHRASES
     * ------------------------------------------------------------
     */

    if (
        englishPhrases.length
    ) {

        const translated =
            await translateBatchFast(
                englishPhrases,
                "en",
                currentLang,
                {
                    allowBackup:
                        backupAllowed()
                }
            );


        if (
            generation !==
            updateGeneration
        ) {

            return;

        }


        translated.forEach(
            (result, index) => {

                const element =
                    document.getElementById(
                        `eng-p-${index}`
                    );


                if (element) {

                    element.innerText =
                        result?.translation ||
                        "";

                }

            }
        );

    }


    /*
     * ------------------------------------------------------------
     * JAPANESE TARGET MAP
     *
     * Japanese should display the user's actual Japanese
     * sentence rather than attempting to manufacture Japanese
     * chunks from English.
     * ------------------------------------------------------------
     */

    if (
        currentLang === "ja"
    ) {

        renderForeignMap(
            foreignPhrases
        );


        foreignPhrases.forEach(
            (phrase, index) => {

                const phraseElement =
                    document.getElementById(
                        `foreign-phrase-${index}`
                    );


                const readingElement =
                    document.getElementById(
                        `for-r-${index}`
                    );


                const romajiElement =
                    document.getElementById(
                        `for-rom-${index}`
                    );


                const translationElement =
                    document.getElementById(
                        `for-p-${index}`
                    );


                /*
                 * Japanese reading.
                 */

                if (
                    phraseElement
                ) {

                    phraseElement.innerText =
                        phrase;

                }


                /*
                 * Japanese reading:
                 * restore the original proven JA -> JA dt=rm path.
                 */
                getJapaneseReading(
                    phrase
                )
                .then(
                    reading => {

                        if (
                            generation !==
                            updateGeneration
                        ) {

                            return;

                        }


                        if (
                            readingElement
                        ) {

                            readingElement.innerText =
                                reading?.hiragana ||
                                "";

                        }


                        if (
                            romajiElement
                        ) {

                            romajiElement.innerText =
                                reading?.romaji ||
                                "";

                        }

                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "Japanese reading display failed:",
                            error
                        );

                    }
                );


                /*
                 * Translate the Japanese phrase back to
                 * English for the explanation under the card.
                 */

                translateUnified(
                    phrase,
                    "ja",
                    "en",
                    {
                        allowBackup:
                            backupAllowed()
                    }
                )
                .then(
                    result => {

                        if (
                            generation !==
                            updateGeneration
                        ) {

                            return;

                        }


                        if (
                            translationElement
                        ) {

                            translationElement.innerText =
                                result?.translation ||
                                "";

                        }

                    }
                );

            }
        );


        /*
         * Re-translation of complete Japanese sentence.
         */

        if (
            foreignText
        ) {

            const retrans =
                await translateUnified(
                    foreignText,
                    "ja",
                    "en",
                    {
                        allowBackup: true
                    }
                );


            if (
                generation !==
                updateGeneration
            ) {

                return;

            }


            document.getElementById(
                "retranslationText"
            ).innerText =
                retrans
                    ? retrans.translation
                    : "Re-translation failed";

        }


        {
        const status = document.getElementById("statusText");
        if (status) {
            const prefix = status.innerText ? status.innerText + " • " : "";
            status.innerText =
                prefix +
                `${englishPhrases.length} English phrase${englishPhrases.length === 1 ? "" : "s"}`;
        }
    }


        return;

    }


    /*
     * ------------------------------------------------------------
     * OTHER LANGUAGES
     * ------------------------------------------------------------
     */

    renderForeignMap(
        foreignPhrases
    );


    if (
        foreignPhrases.length
    ) {

        /*
         * Translate target-language phrase cards INDIVIDUALLY.
         *
         * Batched translation can reorder words across phrase boundaries
         * when translating into English. That caused cases such as:
         *
         *   Ich möchte        -> I want
         *   mit dir           -> to go to the party
         *   auf die Party gehen -> with you
         *
         * The German sentence was correct; the English glosses were simply
         * being assigned to the wrong cards after Google reordered the batch.
         *
         * Individual requests preserve one-to-one card alignment.
         * Backup translation remains disabled for phrase cards.
         */
        const translatedForeign =
            await Promise.all(
                foreignPhrases.map(
                    phrase =>
                        translateUnified(
                            phrase,
                            currentLang,
                            "en",
                            {
                                allowBackup:
                                    backupAllowed()
                            }
                        )
                )
            );


        if (
            generation !==
            updateGeneration
        ) {

            return;

        }


        foreignPhrases.forEach(
            (phrase, index) => {

                const result =
                    translatedForeign[index] ||
                    {};


                const translationElement =
                    document.getElementById(
                        `for-p-${index}`
                    );


                const readingElement =
                    document.getElementById(
                        `for-r-${index}`
                    );


                if (
                    translationElement
                ) {

                    translationElement.innerText =
                        result.translation ||
                        "";

                }


                if (
                    result.translit &&
                    readingElement
                ) {

                    readingElement.innerText =
                        result.translit;

                }

            }
        );

    }


    /*
     * ------------------------------------------------------------
     * COMPLETE TARGET → ENGLISH RETRANSLATION
     * ------------------------------------------------------------
     */

    if (
        foreignText
    ) {

        const retrans =
            await translateUnified(
                foreignText,
                currentLang,
                "en",
                {
                    allowBackup: true
                }
            );


        if (
            generation !==
            updateGeneration
        ) {

            return;

        }


        document.getElementById(
            "retranslationText"
        ).innerText =
            retrans
                ? retrans.translation
                : "Re-translation failed";

    }

    else {

        document.getElementById(
            "retranslationText"
        ).innerHTML =
            "<em>Re-translation will appear here...</em>";

    }


    setStatus(
        `${englishPhrases.length} English phrase${
            englishPhrases.length === 1
                ? ""
                : "s"
        }`
    );

}


/* ================================================================
   INPUT HANDLING
   ================================================================ */

function handleInput(lang) {

    clearTimeout(
        translationTimeout
    );


    if (
        fullTranslationController
    ) {

        fullTranslationController.abort();

        fullTranslationController =
            null;

    }


    const delay =
        isMobileMode()
            ? 900
            : 500;


    translationTimeout =
        setTimeout(
            async () => {

                const auto =
                    document.getElementById(
                        "autoTranslateToggle"
                    ).checked;


                const englishInput =
                    document.getElementById(
                        "englishInput"
                    );


                const foreignInput =
                    document.getElementById(
                        "foreignInput"
                    );


                fullTranslationController =
                    new AbortController();


                const signal =
                    fullTranslationController.signal;


                try {

                    if (
                        lang === "en" &&
                        auto &&
                        englishInput.value.trim()
                    ) {

                        setStatus(
                            "Translating..."
                        );


                        const result =
                            await translateUnified(
                                englishInput.value.trim(),
                                "en",
                                currentLang,
                                {
                                    allowBackup: true,
                                    signal
                                }
                            );


                        if (
                            result &&
                            !signal.aborted
                        ) {

                            foreignInput.value =
                                result.translation;


                            if (
                                result.provider === "backup"
                            ) {

                                setTranslationProviderStatus(
                                    "backup"
                                );

                            }

                            else {

                                setTranslationProviderStatus(
                                    "google"
                                );

                            }

                        }

                        else if (
                            !signal.aborted
                        ) {

                            setTranslationProviderStatus(
                                "unavailable"
                            );

                        }

                    }


                    else if (
                        lang === "foreign" &&
                        auto &&
                        foreignInput.value.trim()
                    ) {

                        setStatus(
                            "Translating..."
                        );


                        const result =
                            await translateUnified(
                                foreignInput.value.trim(),
                                currentLang,
                                "en",
                                {
                                    allowBackup: true,
                                    signal
                                }
                            );


                        if (
                            result &&
                            !signal.aborted
                        ) {

                            englishInput.value =
                                result.translation;


                            if (
                                result.provider === "backup"
                            ) {

                                setTranslationProviderStatus(
                                    "backup"
                                );

                            }

                            else {

                                setTranslationProviderStatus(
                                    "google"
                                );

                            }

                        }

                        else if (
                            !signal.aborted
                        ) {

                            setTranslationProviderStatus(
                                "unavailable"
                            );

                        }

                    }


                    if (
                        !signal.aborted
                    ) {

                        await updatePhraseMaps();

                    }

                }

                catch (
                    error
                ) {

                    if (
                        !error ||
                        error.name !== "AbortError"
                    ) {

                        console.error(
                            "Input translation error:",
                            error
                        );

                    }

                }

                finally {

                    if (
                        fullTranslationController &&
                        fullTranslationController.signal === signal
                    ) {

                        fullTranslationController =
                            null;

                    }

                }

            },
            delay
        );

}


/* ================================================================
   LANGUAGE SWITCHING
   ================================================================ */

function setLanguage(lang) {

    if (
        !LANG_CONFIG[lang]
    ) {

        return;

    }


    currentLang =
        lang;


    const config =
        LANG_CONFIG[lang];


    /*
     * Titles.
     */

    document.getElementById(
        "mainTitle"
    ).innerText =
        `EN ➜ ${lang.toUpperCase()}: Ward's Phrasen-Mapper`;


    document.getElementById(
        "foreignLabel"
    ).innerText =
        `${config.name} Sentence`;


    document.getElementById(
        "foreignRowTitle"
    ).innerText =
        `${config.name} Phrase Map`;


    /*
     * Button states.
     */

    Object.keys(
        LANG_CONFIG
    ).forEach(
        code => {

            const button =
                document.getElementById(
                    "btn" +
                    code.toUpperCase()
                );


            if (!button) {
                return;
            }


            button.className =
                "lang-btn";


            if (
                code === lang
            ) {

                button.classList.add(
                    "active",
                    config.theme
                );

            }

        }
    );


    /*
     * Re-run translation if English exists.
     */

    const english =
        document.getElementById(
            "englishInput"
        ).value.trim();


    if (
        english
    ) {

        handleInput("en");

    }

    else {

        updatePhraseMaps();

    }

}


/* ================================================================
   STATUS
   ================================================================ */

function setStatus(message) {

    const element =
        document.getElementById(
            "statusText"
        );


    if (element) {

        element.innerText =
            message;

    }

}


/* ================================================================
   INITIALIZE
   ================================================================ */

setLanguage("de");

</script>

</body>
</html>
